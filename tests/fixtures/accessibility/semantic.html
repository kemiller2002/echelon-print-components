<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ACCESS-PDF-01 Semantic PDF</title>
<link rel="stylesheet" href="../../../src/styles/print.css">
<style>
@page { size: Letter; margin:.7in; }
body { margin:0; }
table { border-collapse:collapse; width:100%; }
th, td { border:1px solid #777; padding:.08in; text-align:left; }
figure { margin:.2in 0; }
</style>
</head>
<body>
<main>
  <h1>ACCESS-TITLE</h1>
  <p>This document deliberately uses native semantic HTML before PDF export.</p>
  <section aria-labelledby="access-section-heading">
    <h2 id="access-section-heading">ACCESS-SECTION</h2>
    <p>Headings, paragraphs, a data table, and a figure are represented semantically in source HTML.</p>
    <table>
      <caption>ACCESS-TABLE</caption>
      <thead><tr><th scope="col">Measure</th><th scope="col">Value</th></tr></thead>
      <tbody><tr><th scope="row">Readability</th><td>Structural source semantics preserved</td></tr></tbody>
    </table>
    <figure>
      <svg role="img" aria-labelledby="figure-title" width="180" height="70" viewBox="0 0 180 70">
        <title id="figure-title">Simple accessible diagram</title>
        <rect x="1" y="1" width="178" height="68" fill="none" stroke="black"/>
        <text x="15" y="40">ACCESS-FIGURE</text>
      </svg>
      <figcaption>Accessible figure example.</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
