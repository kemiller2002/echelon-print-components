name: GH-14 ROS attribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gh14-ros-attribution.yml

permissions:
  contents: write

jobs:
  attribute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Begin GH-14 through ROS
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros add "Keep canonical report documentation deployment in sync" \
            --id GH-14 \
            --tag folio,documentation,deployment,reports \
            --priority medium \
            --source github-issue \
            --source-reference "https://github.com/kemiller2002/folio/issues/14" \
            --actor "agent:chatgpt"
          ./ros work backlog-transition --action ready --id GH-14 --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id GH-14 --occurred-at "$NOW" --type maintenance
          ./ros work context GH-14

      - name: Validate documentation build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run site:check

      - name: Complete GH-14 and validate ROS
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gh14-ros-attribution.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete --id GH-14 --occurred-at "$NOW" \
            --evidence implementation=.github/workflows/deploy-folio-pages.yml \
            --evidence tests=tests/site-build.test.mjs
          ./ros registry build
          ./ros validate
          ./ros status

      - name: Commit attributed ROS state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ros registries .github/workflows/gh14-ros-attribution.yml
          if [ -d .ros/telemetry ]; then
            git add -f .ros/telemetry
          fi
          if git diff --cached --quiet; then
            echo "ROS produced no attribution changes."
            exit 1
          fi
          git commit -m "chore(ros): complete GH-14 work attribution"
          git pull --rebase origin main
          git push origin HEAD:main
