name: Complete Folio mobile hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-folio-mobile.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-6
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "GH-6" --occurred-at "$NOW" --type feature || true
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete             --id "GH-6"             --occurred-at "$NOW"             --evidence requirements=docs/requirements/FOLIO-SITE-REQUIREMENTS.md             --evidence implementation=site/site.css             --evidence implementation=site/demo.css             --evidence tests=tests/run-site-browser-tests.mjs             --evidence tests=tests/site-build.test.mjs
          ./ros registry build
          ./ros validate
          ./ros status
      - name: Commit ROS completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git reset -- .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete GH-6 Folio mobile hardening"
          git pull --rebase origin main
          git push
