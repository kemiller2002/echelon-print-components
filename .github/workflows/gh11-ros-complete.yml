name: GH-11 ROS complete

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gh11-ros-complete.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Complete GH-11 through ROS
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gh11-ros-complete.yml
          occurred_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete --id GH-11 --occurred-at "$occurred_at" \
            --evidence implementation=src/components/register.js \
            --evidence implementation=src/styles/print.css \
            --evidence tests=tests/run-primitive-component-tests.mjs \
            --evidence tests=tests/run-print-experiments.mjs \
            --evidence documentation=docs/AGENT-USAGE.md
          ./ros registry build
          ./ros validate

      - name: Commit completed ROS state and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ros registries .github/workflows/gh11-ros-complete.yml
          if git diff --cached --quiet; then
            echo "ROS produced no completion changes."
            exit 1
          fi
          git commit -m "chore(ros): complete GH-11 work attribution"
          git push origin HEAD:main
