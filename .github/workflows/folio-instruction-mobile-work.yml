name: Complete Folio instruction and component mobile work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/folio-instruction-mobile-work.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Complete GH-9
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete             --id "GH-9"             --occurred-at "$NOW"             --evidence requirements=docs/requirements/FOLIO-SITE-REQUIREMENTS.md             --evidence implementation=src/styles/print.css             --evidence implementation=tools/build-site.mjs             --evidence documentation=docs/AGENT-USAGE.md             --evidence tests=tests/run-site-browser-tests.mjs             --evidence tests=tests/site-build.test.mjs
          ./ros registry build
          ROS_BASE_REF="$BASE_SHA" ./ros validate
          ./ros status
      - name: Commit ROS completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete GH-9 Folio mobile instruction work"
          git pull --rebase origin main
          git push
