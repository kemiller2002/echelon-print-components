name: Bootstrap Echelon tooling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-echelontooling.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install ROS
        run: npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros init --profile greenfield --project "Echelon Print Components"
      - name: Install Ordo / SDE
        run: npx --yes @echelon-foundry/sde@1.3.0 init
      - name: Install Visual Engineering
        run: npx --yes @echelon-foundry/visual-engineering@1.0.0 init
      - name: Install Communication Engineering
        run: npx --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering init
      - name: Install Limen
        run: npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 init
      - name: Establish Limen boundary directories
        run: |
          mkdir -p src/engine src/kernel
          touch src/engine/.gitkeep src/kernel/.gitkeep
      - name: Verify installations
        run: |
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros verify
          npx --yes @echelon-foundry/sde@1.3.0 verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          npx --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict
      - name: Commit bootstrap
        run: |
          rm .github/workflows/bootstrap-echelontooling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # GitHub Actions' GITHUB_TOKEN cannot create another workflow file.
          # Leave Limen's verified workflow uncommitted; it is added through the
          # repository connection immediately after bootstrap.
          git reset -- .github/workflows/limen-verify.yml
          git commit -m "Install Echelon engineering toolchain"
          git push
