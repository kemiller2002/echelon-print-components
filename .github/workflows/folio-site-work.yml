name: Complete Folio documentation work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/folio-site-work.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify merged Folio site
        run: |
          npm ci
          npm run site:check

      - name: Complete GH-4 and remove temporary tracker
        shell: bash
        run: |
          set -euo pipefail
          WORK_ID="GH-4"
          git rm .github/workflows/folio-site-work.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete             --id "$WORK_ID"             --occurred-at "$NOW"             --evidence requirements=docs/requirements/FOLIO-SITE-REQUIREMENTS.md             --evidence implementation=tools/build-site.mjs             --evidence tests=tests/site-build.test.mjs             --evidence tests=tests/run-site-browser-tests.mjs             --evidence documentation=docs/AGENT-USAGE.md
          ./ros registry build
          ./ros validate
          ./ros status

      - name: Commit completed work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          if git diff --cached --quiet; then
            echo "No completion changes to commit"
            exit 0
          fi
          git commit -m "Complete GH-4 Folio documentation site"
          git pull --rebase origin main
          git push
