name: Begin Folio documentation work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/folio-site-work.yml"

permissions:
  contents: write

jobs:
  begin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Begin GH-4
        shell: bash
        run: |
          set -euo pipefail
          WORK_ID="GH-4"
          ./ros add "Build Folio component documentation site"             --id "$WORK_ID"             --tag folio,print,documentation             --priority high             --source github-issue             --source-reference "https://github.com/kemiller2002/echelon-print-components/issues/4"             --actor "agent:chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "$WORK_ID" --occurred-at "$NOW" --type feature
          ./ros work context "$WORK_ID"
      - name: Commit ROS state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git reset -- .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Begin GH-4 Folio documentation site"
          git pull --rebase origin main
          git push
