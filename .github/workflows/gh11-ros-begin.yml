name: GH-11 ROS begin

on:
  push:
    branches:
      - feat/core-print-primitives
    paths:
      - .github/workflows/gh11-ros-begin.yml

permissions:
  contents: write

jobs:
  begin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/core-print-primitives
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Begin GH-11 through ROS
        shell: bash
        run: |
          set -euo pipefail
          occurred_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work begin --id GH-11 --occurred-at "$occurred_at"
          ./ros work context GH-11
          ./ros validate

      - name: Commit ROS state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros
          if git diff --cached --quiet; then
            echo "ROS produced no state changes."
            exit 1
          fi
          git commit -m "chore(ros): begin GH-11 work attribution"
          git push origin HEAD:feat/core-print-primitives
